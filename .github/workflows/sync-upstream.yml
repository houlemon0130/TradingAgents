name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/TauricResearch/TradingAgents.git
          git fetch upstream main

      - name: Merge upstream into fork
        run: |
          if git merge --ff-only upstream/main >/dev/null 2>&1; then
            echo "Fast-forward sync completed."
          else
            git merge --no-edit upstream/main
            echo "Fork had local commits; merged (may include merge commit)."
          fi

      - name: Push to fork
        run: git push origin main
